<header class="site-header{% if page.url == '/' %} site-header--home{% endif %}">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <p class="site-tagline">{{ site.tagline }}</p>
  <p class="site-subline">{{ site.subline }}</p>
</header>
<nav class="site-nav" aria-label="Hauptnavigation">
  <a href="{{ '/beitraege/' | relative_url }}"{% if page.url contains '/beitraege/' %} aria-current="page"{% endif %}>Beiträge</a>
  <a href="{{ '/ueber-mich/' | relative_url }}"{% if page.url == '/ueber-mich/' %} aria-current="page"{% endif %}>Über mich</a>
  <a href="{{ '/kontakt/' | relative_url }}"{% if page.url == '/kontakt/' %} aria-current="page"{% endif %}>Kontakt</a>
</nav>
