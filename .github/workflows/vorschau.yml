# Baut die Website bei jedem Push und legt Bildschirmfotos als Artefakt ab.
# Veröffentlicht nichts. GitHub Pages bleibt davon unberührt.
name: Vorschau

on:
  push:
    branches-ignore:
      - vorschau
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vorschau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Website bauen (mit Entwürfen)
        run: bundle exec jekyll build --drafts --strict_front_matter

      - name: Bildschirmfotos
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node .github/screenshots.js
      - name: Bildschirmfotos im Zweig "vorschau" ablegen
        run: |
          cd screenshots
          git init -q
          git config user.name "Vorschau"
          git config user.email "vorschau@users.noreply.github.com"
          git add -A
          git commit -q -m "Bildschirmfotos für ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/vorschau
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
