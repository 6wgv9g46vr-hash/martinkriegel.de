<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Vier Wärmequellen für den Neubau des Klinikums Memmingen</title>
<desc id="d">Links vier Balken mit der Wärmeleistung je Quelle: Grundwasser-Wärmepumpe 1.550 Kilowatt (35 Prozent), Fernwärme 1.550 Kilowatt (35 Prozent), Wärmerückgewinnung 800 Kilowatt (18 Prozent), Schmutzwasser-Wärmepumpe 500 Kilowatt (12 Prozent). Rechts zwei gestapelte Säulen: alle vier Quellen zusammen 4.400 Kilowatt; fällt eine der beiden großen Quellen aus, bleiben 2.850 Kilowatt, das sind 65 Prozent.</desc>
<style>
.ink{fill:#16241F}.muted{fill:#4A5C55}.acc{fill:#F2A33A}.acct{fill:#A3550B}
.lbl{font-size:14px}.sm{font-size:12px}.b{font-weight:600}.big{font-size:18px}
</style>
<rect width="860" height="400" fill="#E3EAE7"/>

<!-- Überschriften der beiden Teile -->
<text x="60" y="40" class="ink lbl b">Wärmeleistung je Quelle</text>
<text x="560" y="40" class="ink lbl b">Was bleibt, wenn eine Quelle ausfällt?</text>

<!-- Linker Teil: Balken, Maßstab 1.550 kW = 160 px, Start x = 268 -->
<g class="ink lbl">
  <text x="60" y="95">Grundwasser-Wärmepumpe</text>
  <text x="60" y="155">Fernwärme</text>
  <text x="60" y="215">Wärmerückgewinnung</text>
  <text x="60" y="275">Schmutzwasser-Wärmepumpe</text>
</g>
<g class="acc">
  <rect x="268" y="78" width="160" height="24" rx="2"/>
  <rect x="268" y="138" width="160" height="24" rx="2"/>
  <rect x="268" y="198" width="82.6" height="24" rx="2"/>
  <rect x="268" y="258" width="51.6" height="24" rx="2"/>
</g>
<g class="ink sm" text-anchor="end">
  <text x="540" y="95"><tspan class="b">1.550 kW</tspan> · 35 %</text>
  <text x="540" y="155"><tspan class="b">1.550 kW</tspan> · 35 %</text>
  <text x="540" y="215"><tspan class="b">800 kW</tspan> · 18 %</text>
  <text x="540" y="275"><tspan class="b">500 kW</tspan> · 12 %</text>
</g>
<line x1="268" y1="70" x2="268" y2="290" stroke="#16241F" stroke-width="1.5"/>
<text x="60" y="318" class="muted sm">Zusammen 4.400 kW, ausgelegt für sehr kalte Tage.</text>
<text x="60" y="336" class="muted sm">An den meisten Tagen braucht das Haus deutlich weniger.</text>

<!-- Rechter Teil: gestapelte Säulen, Maßstab 4.400 kW = 240 px, Grundlinie y = 340 -->
<!-- Segmente von unten: Schmutzwasser 500 = 27,3 px; WRG 800 = 43,6 px; Fernwärme 1.550 = 84,5 px; Grundwasser 1.550 = 84,5 px -->
<g class="acc" stroke="#E3EAE7" stroke-width="2">
  <!-- Säule 1: alle vier Quellen, x = 600 -->
  <rect x="600" y="312.7" width="64" height="27.3"/>
  <rect x="600" y="269.1" width="64" height="43.6"/>
  <rect x="600" y="184.5" width="64" height="84.5"/>
  <rect x="600" y="100" width="64" height="84.5"/>
  <!-- Säule 2: ohne eine große Quelle, x = 720 -->
  <rect x="720" y="312.7" width="64" height="27.3"/>
  <rect x="720" y="269.1" width="64" height="43.6"/>
  <rect x="720" y="184.5" width="64" height="84.5"/>
</g>
<rect x="720" y="100" width="64" height="84.5" fill="none" stroke="#4A5C55" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="752" y="146" class="muted sm" text-anchor="middle">fällt aus</text>
<line x1="580" y1="340" x2="804" y2="340" stroke="#16241F" stroke-width="1.5"/>

<g text-anchor="middle">
  <text x="632" y="78" class="ink big b">4.400 kW</text>
  <text x="632" y="94" class="muted sm">alle vier Quellen</text>
  <text x="752" y="78" class="ink big b">2.850 kW</text>
  <text x="752" y="94" class="muted sm">65 % bleiben</text>
  <text x="632" y="362" class="ink sm">Normalfall</text>
  <text x="752" y="362" class="ink sm">eine große Quelle fehlt</text>
</g>

<!-- Quelle -->
<text x="60" y="386" class="muted sm">Angaben des Klinikums Memmingen zum Neubau (Projektseite). Prozentwerte wie dort gerundet.</text>
</svg>
