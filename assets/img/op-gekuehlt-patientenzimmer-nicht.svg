<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" role="img" aria-labelledby="t d" font-family="'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Gekühlte Räume in den Krankenhäusern Nordrhein-Westfalens</title>
<desc id="d">Fünf waagerechte Balken zeigen je Raumart den Anteil vollständig, teilweise und nicht gekühlter oder klimatisierter Räume. OP-Säle: über 96 Prozent vollständig. Intensivbetten: 82,6 Prozent vollständig, 8,8 Prozent teilweise, 8,7 Prozent nicht. Kreißsäle: zwei Drittel vollständig, 11 Prozent teilweise, 23 Prozent nicht. Notaufnahmen: rechnerisch rund 32 Prozent vollständig, fast 28 Prozent teilweise, gut 40 Prozent nicht. Patientenzimmer: eines von zehn gekühlt, neun von zehn nicht. Quelle: Umfrage der Krankenhausgesellschaft Nordrhein-Westfalen, 14. bis 27. August 2026, 116 Krankenhäuser mit 195 Standorten.</desc>
<style>
.ink{fill:#16241F}.muted{fill:#4A5C55}.acc{fill:#F2A33A}.acc2{fill:#F8D49A}.none{fill:#B9C5C0}
.lbl{font-size:14px}.sm{font-size:12px}.b{font-weight:600}.big{font-size:18px}
</style>
<rect width="860" height="410" fill="#E3EAE7"/>

<!-- Überschrift -->
<text x="60" y="36" class="ink lbl b">Welche Räume in NRW-Kliniken gekühlt oder klimatisiert sind</text>

<!-- Legende -->
<g class="sm">
  <rect x="60" y="50" width="12" height="12" class="acc"/>
  <text x="78" y="61" class="ink">vollständig</text>
  <rect x="160" y="50" width="12" height="12" class="acc2"/>
  <text x="178" y="61" class="ink">teilweise</text>
  <rect x="250" y="50" width="12" height="12" class="none"/>
  <text x="268" y="61" class="ink">nicht gekühlt</text>
  <rect x="366" y="50" width="12" height="12" fill="none" stroke="#4A5C55" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="384" y="61" class="ink">keine Angabe</text>
</g>

<!-- Zeilenbeschriftungen -->
<g class="ink lbl">
  <text x="60" y="107">OP-Säle</text>
  <text x="60" y="167">Intensivbetten</text>
  <text x="60" y="227">Kreißsäle</text>
  <text x="60" y="287">Notaufnahmen</text>
  <text x="60" y="347">Patientenzimmer</text>
</g>

<!-- Balken, Maßstab 100 % = 440 px, Start x = 230, Höhe 26 -->
<!-- OP-Säle: 96 % vollständig, 4 % keine Angabe -->
<rect x="230" y="90" width="422.4" height="26" class="acc"/>
<rect x="652.4" y="90" width="17.6" height="26" fill="none" stroke="#4A5C55" stroke-width="1" stroke-dasharray="3 2"/>
<!-- Intensivbetten: 82,6 / 8,8 / 8,7 -->
<rect x="230" y="150" width="363.4" height="26" class="acc"/>
<rect x="593.4" y="150" width="38.7" height="26" class="acc2"/>
<rect x="632.1" y="150" width="37.9" height="26" class="none"/>
<!-- Kreißsäle: 66 / 11 / 23 -->
<rect x="230" y="210" width="290.4" height="26" class="acc"/>
<rect x="520.4" y="210" width="48.4" height="26" class="acc2"/>
<rect x="568.8" y="210" width="101.2" height="26" class="none"/>
<!-- Notaufnahmen: 32 (rechnerisch) / 28 / 40 -->
<rect x="230" y="270" width="140.8" height="26" class="acc"/>
<rect x="370.8" y="270" width="123.2" height="26" class="acc2"/>
<rect x="494" y="270" width="176" height="26" class="none"/>
<!-- Patientenzimmer: 10 / 90 -->
<rect x="230" y="330" width="44" height="26" class="acc"/>
<rect x="274" y="330" width="396" height="26" class="none"/>

<line x1="230" y1="82" x2="230" y2="364" stroke="#16241F" stroke-width="1.5"/>

<!-- Kennzahl rechts: Anteil vollständig gekühlt -->
<g class="ink" text-anchor="start">
  <text x="684" y="108" class="big b">über 96 %</text>
  <text x="684" y="168" class="big b">82,6 %</text>
  <text x="684" y="228" class="big b">zwei Drittel</text>
  <text x="684" y="288" class="big b">rund 32 %*</text>
  <text x="684" y="348" class="big b">10 %</text>
</g>

<!-- Fußnote -->
<text x="60" y="380" class="muted sm">Zahl rechts: Anteil vollständig gekühlt. * rechnerisch aus „gut 40 % nicht“ und „fast 28 % teilweise“.</text>
<text x="60" y="394" class="muted sm">Quelle: Umfrage der Krankenhausgesellschaft NRW, 14. bis 27.8.2026, 116 Krankenhäuser mit 195 Standorten.</text>
</svg>
